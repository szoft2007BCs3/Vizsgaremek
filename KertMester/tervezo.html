<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kertmester — Tervező</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/tervezo.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="icon" type="image/png" href="imgs/icon.png"/>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="Kertmester — kezdőlap">
        <img class="brand-mark logo-img" src="imgs/icon.png" alt="Logo">
        <span class="brand-name">Kertmester</span>
      </a>

      <button class="hamburger" id="hamburgerBtn" aria-expanded="false" aria-controls="siteNav"
        aria-label="Menü megnyitása">
        <span class="hamburger-box">
          <span class="hamburger-line line1"></span>
          <span class="hamburger-line line2"></span>
          <span class="hamburger-line line3"></span>
        </span>
        <span class="hamburger-label">Menü</span>
      </button>
    </div>
  </header>

  <div class="nav-overlay" id="navOverlay"></div>

  <nav class="site-nav" id="siteNav" aria-hidden="true">
    <div class="nav-top">
      <span class="nav-brand">Kertmester</span>
      <button class="nav-close" id="navCloseBtn" aria-label="Menü bezárása">
        <span></span>
        <span></span>
      </button>
    </div>

    <ol class="nav-list">
      <li style="--i:0"><a href="index.html" data-nav>Főoldal</a></li>
      <li style="--i:1"><a href="tervezo.html" data-nav>Tervező</a></li>
      <li style="--i:2"><a href="webshop.html" data-nav>Webshop</a></li>
    </ol>

    <div class="nav-foliage" aria-hidden="true">
        <img class="logo-img logo-img--ghost" src="imgs/icon.png" alt="Logo">
    </div>
  </nav>

  <main class="planner">
    <aside class="panel planner-toolbar">
      <h2 class="panel-title">Eszköztár</h2>
    </aside>

    <section class="panel planner-menu">
      <h2 class="panel-title">Rajzmenü</h2>
    </section>

    <section class="panel planner-canvas">
      <h2 class="panel-title">Tervező</h2>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="footer-name">Kertmester</span>
      </div>

      <div class="footer-col">
        <h3>Navigáció</h3>
        <ul>
          <li><a href="index.html">Főoldal</a></li>
          <li><a href="tervezo.html">Tervező</a></li>
          <li><a href="webshop.html">Webshop</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h3>Elérhetőség</h3>
        <ul>
          <li><a href="mailto:hello@kertmester.hu">hello@kertmester.hu</a></li>
          <li><a href="tel:+36301234567">+36 30 123 4567</a></li>
          <li>Szombathely, Vas megye</li>
        </ul>
      </div>
    </div>

    <div class="footer-divider" aria-hidden="true"></div>

    <div class="footer-bottom">
      <span>© 2026 Kertmester</span>
    </div>
  </footer>

  <script src="js/nav.js"></script>

</html>
